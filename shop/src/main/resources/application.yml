server:
  port: 8099

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/RS_system?currentSchema=public
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.xmut.shop.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
